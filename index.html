<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>EXPO DVT 2026 · Cerrada</title>
<style>
  :root{--rojo:#E30613;--tinta:#1d1d1f;--gris:#6b6b70;--fondo:#f5f5f7}
  *{box-sizing:border-box}
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;background:var(--fondo);color:var(--tinta);font-family:Arial,Helvetica,sans-serif;padding:16px}
  .card{background:#fff;max-width:440px;width:100%;border-radius:16px;padding:36px 28px;text-align:center;box-shadow:0 10px 30px rgba(0,0,0,.08);border-top:6px solid var(--rojo)}
  h1{margin:0 0 6px;font-size:26px;letter-spacing:.5px}
  h2{margin:0 0 18px;font-size:16px;color:var(--rojo);text-transform:uppercase;letter-spacing:1px}
  p{margin:0;color:var(--gris);line-height:1.5}
</style>
</head>
<body>
  <div class="card">
    <h1>EXPO DVT 2026</h1>
    <h2>Captura cerrada</h2>
    <p>Gracias por su participación. La plataforma de pedidos ya no está disponible.</p>
  </div>
<script>
// Quita la copia guardada de la plataforma anterior en este dispositivo
try{if('serviceWorker' in navigator)navigator.serviceWorker.getRegistrations().then(rs=>rs.forEach(r=>r.unregister()))}catch(e){}
try{if(window.caches)caches.keys().then(ks=>ks.forEach(k=>caches.delete(k)))}catch(e){}
</script>
</body>
</html>
